[package]
name = "client"
version = "0.1.0"
edition = "2024"

[dependencies]
clap = { version = "4.5", features = ["suggestions", "color", "derive"] }
prost = "0.14.1"
xxhash-rust = { version = "0.8.15" , features = ["xxh3", "xxh64"] }
ctrlc = "3.4.7"
redb = "3.0.1"
toml = "0.9.5"
serde = { version = "1.0.219", features = ["derive"] }

[build-dependencies]
prost-build = "0.14.1"